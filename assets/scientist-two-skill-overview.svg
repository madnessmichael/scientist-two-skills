   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3866d5" x="50.4" y="42.19125" transform="rotate(-0 50.4 42.19125)">SCIENTIST TWO  /  RESEARCH SKILL</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="50.4" y="89.696875" transform="rotate(-0 50.4 89.696875)">From a limitation to a defensible finding.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="50.4" y="125.099063" transform="rotate(-0 50.4 125.099063)">Test ideas cheaply. Learn from failures. Make every claim traceable.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3866d5" x="69.12" y="199.15125" transform="rotate(-0 69.12 199.15125)">01  DISCOVER</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="69.12" y="234.0325" transform="rotate(-0 69.12 234.0325)">Find a gap worth testing</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="94.32" y="281.619625" transform="rotate(-0 94.32 281.619625)">Limitation → hypothesis</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="69.12" y="305.71125" transform="rotate(-0 69.12 305.71125)">Identify a baseline weakness.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="69.12" y="325.013281" transform="rotate(-0 69.12 325.013281)">Propose a mechanism that addresses it.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="94.32" y="355.11275" transform="rotate(-0 94.32 355.11275)">Check the closest work</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="69.12" y="379.15125" transform="rotate(-0 69.12 379.15125)">Compare distinct candidate ideas.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="69.12" y="398.453281" transform="rotate(-0 69.12 398.453281)">Record novelty evidence and uncertainty.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16847d" x="430.56" y="199.15125" transform="rotate(-0 430.56 199.15125)">02  EXPERIMENT</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="430.56" y="234.0325" transform="rotate(-0 430.56 234.0325)">Earn the right to scale</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="455.76" y="281.67275" transform="rotate(-0 455.76 281.67275)">Reproduce → screen</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="430.56" y="305.71125" transform="rotate(-0 430.56 305.71125)">Establish the subset baseline.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="430.56" y="325.013281" transform="rotate(-0 430.56 325.013281)">Evaluate candidates under aligned conditions.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="455.76" y="355.059625" transform="rotate(-0 455.76 355.059625)">Scale the promising ideas</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="430.56" y="379.15125" transform="rotate(-0 430.56 379.15125)">Good → full benchmark</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="430.56" y="398.453281" transform="rotate(-0 430.56 398.453281)">Engineer → bounded repair   ·   Bad → prune</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7855b8" x="792" y="199.15125" transform="rotate(-0 792 199.15125)">03  STRENGTHEN</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="792" y="234.0325" transform="rotate(-0 792 234.0325)">Let evidence revise the story</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 13.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="817.2" y="281.67275" transform="rotate(-0 817.2 281.67275)">Ablate → refine</text>
   </g>
   <g id="text_23">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="792" y="305.71125" transform="rotate(-0 792 305.71125)">Isolate the sources of gain.</text>
   </g>
   <g id="text_24">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="792" y="325.013281" transform="rotate(-0 792 325.013281)">Keep revisions only after verification.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 13.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b45" x="817.2" y="355.059625" transform="rotate(-0 817.2 355.059625)">Review → targeted experiments</text>
   </g>
   <g id="text_26">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="792" y="379.15125" transform="rotate(-0 792 379.15125)">Resolve criticism with new evidence.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="792" y="398.453281" transform="rotate(-0 792 398.453281)">Update the method, results and manuscript.</text>
   </g>
   <g id="text_28">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7855b8" x="576" y="446.249219" transform="rotate(-0 576 446.249219)">Failures, ablations and reviews feed the next hypothesis</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b7c9e4" x="73.44" y="510.635312" transform="rotate(-0 73.44 510.635312)">THE CLAIM–ARTIFACT CHAIN</text>
   </g>
   <g id="text_30">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="73.44" y="539.819062" transform="rotate(-0 73.44 539.819062)">Scores ↔ outputs     ·     Task rules     ·     Verified references     ·     Method ↔ code</text>
   </g>
   <g id="text_31">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50627a" x="50.4" y="589.253281" transform="rotate(-0 50.4 589.253281)">Budget-bounded iteration  •  Preserve the best verified state  •  Report negative findings</text>
   </g>
   <g id="text_32">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #50627a" x="1100.88" y="588.701406" transform="rotate(-0 1100.88 588.701406)">Adapted from ScientistTwo · arXiv:2609.19644v1</text>
   </g>
  </g>
 </g>
